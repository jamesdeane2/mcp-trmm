[project]
name = "mcp-trmm"
version = "0.1.0"
description = "Model Context Protocol server for Tactical RMM API integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-trmm = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
include = [
    "server.py",
    "*.md",
    "LICENSE",
]

[tool.uv]
dev-dependencies = []
